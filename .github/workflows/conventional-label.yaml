# auto add labels to PRs
on:
  pull_request_target:
    types: [ opened, edited ]

permissions:
  contents: read
  pull-requests: write

name: conventional-release-labels
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: bcoe/conventional-release-labels@886f696738527c7be444262c327c89436dfb95a8 # v1
