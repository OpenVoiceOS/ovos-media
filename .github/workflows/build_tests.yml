name: Run Build Tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      # test_path is empty by default in the shared workflow, which skips
      # test execution and verifies the build and install only. The unit
      # tree runs here so it is measured on every supported Python, not
      # only on the single version coverage.yml uses. end2end stays out:
      # ovoscope.yml owns it and it needs the media harness.
      install_extras: 'test'
      test_path: 'test/unittests'
      # TEMPORARY until ovos-plugin-manager 3.0.0a1 releases: this branch
      # targets the unreleased MediaBackend v2 template.
      pre_install_pip: "git+https://github.com/OpenVoiceOS/ovos-plugin-manager@feat/media-backend-v2"
