name: End-to-End Integration Tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  end2end:
    uses: OpenVoiceOS/gh-automations/.github/workflows/ovoscope.yml@dev
    secrets: inherit
    with:
      test_path: "test/end2end/"
      install_extras: "test"
      # The end2end harness lives in ovoscope's [media] extra. The reusable
      # workflow's own install step does a bare `pip install ovoscope` (latest
      # stable, no media extra), so install the media harness up-front.
      # Pinning the prerelease as the floor lets pip resolve it without --pre.
      # 1.6.11a1 is the floor because OCPPlayerHarness only conditionally
      # patches ovos_media.player.GUIInterface (hasattr-guarded) from that
      # version on — ovos-media no longer defines GUIInterface at all after
      # the GUI-removal restructure, and older ovoscope harness builds
      # unconditionally patched it, AttributeError-ing on construction.
      pre_install_pip: "ovoscope[media]>=1.6.11a1 git+https://github.com/OpenVoiceOS/ovos-plugin-manager@feat/media-backend-v2"  # TEMPORARY: v2 template until opm 3.0.0a1
