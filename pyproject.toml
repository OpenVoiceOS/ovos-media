[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-media"
dynamic = ["version"]
description = "ovos-media — OCP-native audio/video/web media service for OpenVoiceOS"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

dependencies = [
    "ovos-utils~=0.0, >=0.13.14a1",
    "ovos-bus-client~=2.0, >=2.0.0a1",
    "ovos-config~=2.1,>=2.1.1",
    # MediaBackend v2 (bind_event_reporter/PlaybackEvent, no ocp_*
    # self-emission) is a breaking OPM change (PR #442 carries the breaking
    # label, so release automation cuts it as 3.0.0a1): a v1 plugin resolves
    # against the <3.0.0 line and keeps working there, unaware of this pin;
    # a plugin ported to v2 pins >=3.0.0a1 for itself. This PR stays draft
    # until #442 actually publishes 3.0.0a1 and the plugin fleet is ported.
    # MediaBackend v2 template. Floor kept resolvable while 3.0.0a1 is
    # unreleased (CI overlays the template branch via pre_install_pip);
    # bumped to >=3.0.0a1,<4.0.0 at the OPM v2 release, before merge.
    "ovos-plugin-manager>=2.11.6a1,<4.0.0",
    "ovos-workshop>=0.0.15",
    "json-database>=0.9.0",
    "dbus_next",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-media"
Repository = "https://github.com/OpenVoiceOS/ovos-media"

[project.optional-dependencies]
extras = [
    "ovos-ocp-youtube-plugin",
    "ovos-ocp-m3u-plugin",
    "ovos-ocp-rss-plugin",
    "ovos-ocp-files-plugin",
    "ovos-ocp-news-plugin",
]
# optional: faster Aho-Corasick OCP keyword matching for large catalogs
# (liked-songs entity registration). Absence is tolerated at runtime -
# see OCPMediaCatalog.__init__ in ovos_media/player.py.
ner = [
    "ahocorasick_ner",
]
test = [
    "pytest",
    "pytest-cov",
    "orjson",
    "ovoscope[media]>=1.6.11a1",
]

[project.scripts]
ovos-media = "ovos_media.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ovos_media*"]

[tool.setuptools.package-data]
ovos_media = ["locale/*/*", "qt5/**/*"]

[tool.setuptools.dynamic]
version = {attr = "ovos_media.version.__version__"}
